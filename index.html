<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Japan Map with Leaflet</title>
    <!-- No favicon is shipped; avoid an implicit /favicon.ico 404. -->
    <link rel="icon" href="data:,">

    <!-- Runtime config stays a classic script, loaded before the module.
         Vite serves/emits a default; deployment injects the production settings. -->
    <script src="./config.js" vite-ignore></script>

    <!-- Vite bundles TypeScript, npm Leaflet/plugins, and their library CSS. -->
    <script src="./script.ts" type="module"></script>

    <!-- 4. Link to your custom CSS files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="src/features/markers/markers.css">
    <link rel="stylesheet" href="src/features/overlays/overlays.css">
    <link rel="stylesheet" href="src/features/carousel/carousel.css">

    <!-- 5. Link to your custom font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">

    <!-- Font Awesome CSS (from CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>


<body>
    <div id="map"></div>
</body>

</html>
