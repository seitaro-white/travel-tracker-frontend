<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Japan Map with Leaflet</title>

    <!-- 1. Include Leaflet CSS (from CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- 2. Link to your custom CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Adventures in Japan</h1>

    <!-- 3. The div element where the map will be rendered -->
    <div id="map"></div>

    <!-- 4. Include Leaflet JavaScript (from CDN) - BEFORE your script.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- 5. Link to your custom JavaScript file - AFTER Leaflet JS -->
    <script src="script.js"></script>

    <!--
        Alternative for step 5 (if you prefer script tags in <head>):
        <script src="script.js" defer></script>
        The 'defer' attribute ensures the script executes after the HTML is parsed.
    -->

</body>
</html>
