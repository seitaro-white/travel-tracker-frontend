name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Permissions required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy at a time; cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Runtime settings are intentionally separate from the hashed app bundle.
      # The browser can read this key; GitHub secrets keep it out of git history,
      # not out of the deployed site. Restrict its allowed origins at the provider.
      - name: Inject API key into built config.js
        env:
          THUNDERFOREST_API_KEY: ${{ secrets.THUNDERFOREST_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          const config = {
              useThunderforest: true,
              thunderforestApiKey: process.env.THUNDERFOREST_API_KEY,
          };
          writeFileSync('dist/config.js', `window.__APP_CONFIG__ = ${JSON.stringify(config)};\n`);
          EOF

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
