name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Permissions required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy at a time; cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Write config.js from the STADIA_API_KEY secret. This file is gitignored
      # and never committed, so the key stays out of git history entirely.
      - name: Inject API key into config.js
        run: |
          cat > config.js << EOF
          // config.js — generated by the deploy workflow from a GitHub secret.
          window.__APP_CONFIG__ = {
              stadiaApiKey: '${{ secrets.STADIA_API_KEY }}',
          };
          EOF

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
