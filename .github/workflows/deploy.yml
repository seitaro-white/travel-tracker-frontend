name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Permissions required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy at a time; cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Write config.js from GitHub secrets. This file is gitignored and never
      # committed, so the key stays out of git history entirely.
      # `useThunderforest: true` is the production flag script.js checks to pick
      # the Thunderforest basemap; locally (no config.js) it falls back to CartoDB.
      - name: Inject API key into config.js
        run: |
          cat > config.js << EOF
          // config.js — generated by the deploy workflow from GitHub secrets.
          window.__APP_CONFIG__ = {
              useThunderforest: true,
              thunderforestApiKey: '${{ secrets.THUNDERFOREST_API_KEY }}',
          };
          EOF

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
